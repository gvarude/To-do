<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TickTick — Safari Web App</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --tt-blue: #4772FA;
      --tt-blue-hover: #365EE0;
      --tt-blue-soft: rgba(71, 114, 250, 0.1);
      --tt-red: #E14D43;
      --tt-amber: #F59E0B;
      --tt-gray: #9CA3AF;
      --bg-app: #FFFFFF;
      --bg-sidebar: #F6F7F9;
      --bg-rail: #4772FA;
      --bg-hover: #EFF1F5;
      --bg-card: #FFFFFF;
      --border-subtle: #E5E7EB;
      --text-primary: #1F2329;
      --text-secondary: #646A73;
      --text-muted: #8F959E;
      --safari-bar: #F1F2F4;
      --safari-input: #E3E5E8;
    }

    .theme-dark {
      --bg-app: #18191C;
      --bg-sidebar: #202126;
      --bg-rail: #141518;
      --bg-hover: #2A2C32;
      --bg-card: #22242A;
      --border-subtle: #2E3038;
      --text-primary: #ECEEF2;
      --text-secondary: #A1A6B0;
      --text-muted: #6E737D;
      --safari-bar: #26272B;
      --safari-input: #1A1B1E;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.35);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.6);
    }

    .tt-checkbox {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1.75px solid var(--cb-color, #9CA3AF);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.16s ease;
      flex-shrink: 0;
      background: transparent;
    }
    .tt-checkbox:hover {
      background: rgba(71, 114, 250, 0.08);
      transform: scale(1.05);
    }
    .tt-checkbox.checked {
      background: var(--cb-color, #4772FA);
      border-color: var(--cb-color, #4772FA);
    }

    .task-row {
      transition: background-color 0.12s ease;
    }
    .task-row:hover {
      background-color: var(--bg-hover);
    }
    .task-row.selected {
      background-color: var(--tt-blue-soft);
    }

    @keyframes popCheck {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .animate-check {
      animation: popCheck 0.22s ease-out;
    }

    .safari-toolbar {
      background: var(--safari-bar);
      border-bottom: 1px solid var(--border-subtle);
      user-select: none;
    }
    .safari-url-pill {
      background: var(--safari-input);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col">

  <!-- macOS Safari Browser Chrome -->
  <header id="safari-chrome" class="safari-toolbar h-10 px-3 flex items-center justify-between gap-2 shrink-0">
    <div class="flex items-center gap-3">
      <!-- Traffic Lights -->
      <div class="hidden sm:flex items-center gap-1.5 mr-1">
        <span class="w-3 h-3 rounded-full bg-[#FF5F56] border border-[#E0443E] inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-[#FFBD2E] border border-[#DEA123] inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-[#27C93F] border border-[#1AAB29] inline-block"></span>
      </div>
      <!-- Sidebar Toggle & Nav -->
      <div class="flex items-center gap-1 text-[var(--text-secondary)]">
        <button id="btn-toggle-sidebar" title="Toggle Sidebar" class="p-1.5 rounded-md hover:bg-black/5 dark:hover:bg-white/10 transition">
          <i data-lucide="panel-left" class="w-4 h-4"></i>
        </button>
        <button id="btn-nav-back" title="Back" class="hidden md:inline-flex p-1 rounded-md hover:bg-black/5 opacity-60 hover:opacity-100 transition">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
        <button id="btn-nav-fwd" title="Forward" class="hidden md:inline-flex p-1 rounded-md hover:bg-black/5 opacity-40 transition">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Unified Safari Address / Search Bar -->
    <div class="flex-1 max-w-xl mx-auto">
      <div class="safari-url-pill h-7 rounded-lg px-3 flex items-center justify-between text-xs text-[var(--text-secondary)] shadow-inner">
        <div class="flex items-center gap-1.5 truncate">
          <i data-lucide="lock" class="w-3 h-3 text-emerald-600 shrink-0"></i>
          <span id="safari-url-text" class="truncate font-medium text-[var(--text-primary)]">app.ticktick.com/webapp/#q/all/today</span>
        </div>
        <button id="btn-safari-reload" title="Sync / Refresh" class="p-0.5 rounded hover:bg-black/10 transition shrink-0">
          <i data-lucide="rotate-cw" class="w-3 h-3"></i>
        </button>
      </div>
    </div>

    <!-- Safari Right Controls -->
    <div class="flex items-center gap-1 text-[var(--text-secondary)]">
      <button id="btn-quick-search-top" title="Search Tasks (⌘K)" class="p-1.5 rounded-md hover:bg-black/5 transition">
        <i data-lucide="search" class="w-4 h-4"></i>
      </button>
      <button id="btn-theme-toggle" title="Toggle Dark Mode" class="p-1.5 rounded-md hover:bg-black/5 transition">
        <i data-lucide="moon" class="w-4 h-4"></i>
      </button>
      <button id="btn-hide-safari" title="Hide Safari Bar" class="hidden sm:inline-flex p-1.5 rounded-md hover:bg-black/5 transition">
        <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </header>

  <!-- Floating Restore Safari Bar Button (shown when chrome is hidden) -->
  <button id="btn-show-safari" class="hidden fixed top-2 right-2 z-50 px-2.5 py-1 rounded-md text-xs font-medium bg-[var(--bg-card)] border border-[var(--border-subtle)] shadow-md text-[var(--text-secondary)] hover:text-[var(--text-primary)]">
    Show Safari Bar
  </button>

  <!-- Main TickTick Web App Shell -->
  <div class="flex-1 flex min-h-0 overflow-hidden relative">

    <!-- 1. Far-Left Primary Navigation Rail -->
    <aside class="w-13 sm:w-14 flex flex-col items-center justify-between py-3 shrink-0 select-none z-20" style="background-color: var(--bg-rail);">
      <div class="flex flex-col items-center gap-3 w-full">
        <!-- Profile Avatar -->
        <button id="btn-profile" title="Account & Settings" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 text-white font-semibold text-xs flex items-center justify-center transition ring-2 ring-white/25">
          TT
        </button>

        <div class="w-6 h-px bg-white/15 my-0.5"></div>

        <!-- Primary Views -->
        <button data-nav="tasks" class="rail-btn w-9 h-9 rounded-xl flex items-center justify-center text-white/75 hover:text-white hover:bg-white/15 transition" title="Tasks">
          <i data-lucide="check-square" class="w-5 h-5"></i>
        </button>
        <button data-nav="calendar" class="rail-btn w-9 h-9 rounded-xl flex items-center justify-center text-white/75 hover:text-white hover:bg-white/15 transition" title="Calendar">
          <i data-lucide="calendar" class="w-5 h-5"></i>
        </button>
        <button data-nav="matrix" class="rail-btn w-9 h-9 rounded-xl flex items-center justify-center text-white/75 hover:text-white hover:bg-white/15 transition" title="Eisenhower Matrix">
          <i data-lucide="layout-grid" class="w-5 h-5"></i>
        </button>
        <button data-nav="pomodoro" class="rail-btn w-9 h-9 rounded-xl flex items-center justify-center text-white/75 hover:text-white hover:bg-white/15 transition" title="Pomodoro Focus">
          <i data-lucide="timer" class="w-5 h-5"></i>
        </button>
        <button data-nav="habits" class="rail-btn w-9 h-9 rounded-xl flex items-center justify-center text-white/75 hover:text-white hover:bg-white/15 transition" title="Habit Tracker">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex flex-col items-center gap-2.5">
        <button id="btn-rail-search" title="Quick Search (/)" class="w-9 h-9 rounded-xl flex items-center justify-center text-white/75 hover:text-white hover:bg-white/15 transition">
          <i data-lucide="search" class="w-4 h-4"></i>
        </button>
        <button id="btn-rail-settings" title="Settings & Demo Reset" class="w-9 h-9 rounded-xl flex items-center justify-center text-white/75 hover:text-white hover:bg-white/15 transition">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </aside>

    <!-- 2. Lists & Smart Lists Sidebar (shown in Tasks view) -->
    <aside id="lists-sidebar" class="w-60 shrink-0 border-r flex flex-col min-h-0 select-none transition-all duration-200 z-10" style="background-color: var(--bg-sidebar); border-color: var(--border-subtle);">
      <div class="flex-1 overflow-y-auto custom-scroll p-2.5 space-y-4">
        <!-- Smart Lists -->
        <div class="space-y-0.5" id="smart-lists-container"></div>

        <div class="h-px mx-2" style="background-color: var(--border-subtle);"></div>

        <!-- Custom Lists -->
        <div>
          <div class="px-2.5 py-1 flex items-center justify-between text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)]">
            <span>Lists</span>
            <button id="btn-add-list" title="Add New List" class="p-0.5 rounded hover:bg-black/5 text-[var(--text-secondary)] hover:text-[var(--tt-blue)] transition">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <div class="space-y-0.5 mt-1" id="custom-lists-container"></div>
        </div>

        <div class="h-px mx-2" style="background-color: var(--border-subtle);"></div>

        <!-- Tags -->
        <div>
          <div class="px-2.5 py-1 text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)]">Tags</div>
          <div class="flex flex-wrap gap-1.5 px-2 mt-1.5" id="tags-container"></div>
        </div>

        <div class="h-px mx-2" style="background-color: var(--border-subtle);"></div>

        <!-- Archive / Trash -->
        <div class="space-y-0.5" id="bottom-lists-container"></div>
      </div>

      <!-- Focus Mini Status -->
      <div id="sidebar-pomo-pill" class="hidden m-2.5 p-2.5 rounded-xl border text-xs flex items-center justify-between cursor-pointer" style="background-color: var(--bg-card); border-color: var(--border-subtle);">
        <div class="flex items-center gap-2 truncate">
          <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
          <span class="font-medium truncate" id="sidebar-pomo-time">25:00</span>
        </div>
        <span class="text-[var(--tt-blue)] font-medium">Focus</span>
      </div>
    </aside>

    <!-- 3. Main Content Workspace -->
    <main id="main-workspace" class="flex-1 flex min-w-0 min-h-0 overflow-hidden" style="background-color: var(--bg-app);">
      <!-- Dynamically populated by active module (Tasks, Calendar, Matrix, Pomodoro, Habits) -->
    </main>

    <!-- 4. Right Task Detail Pane (shown in Tasks view when a task is selected) -->
    <aside id="detail-pane" class="hidden w-80 lg:w-96 shrink-0 border-l flex-col min-h-0" style="background-color: var(--bg-app); border-color: var(--border-subtle);">
      <!-- Populated dynamically -->
    </aside>
  </div>

  <!-- Modal Overlay (Add List / Search / Settings / New Habit) -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-[1px] flex items-center justify-center p-4">
    <div id="modal-content" class="w-full max-w-md rounded-2xl border shadow-2xl overflow-hidden" style="background-color: var(--bg-card); border-color: var(--border-subtle);">
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    (function () {
      'use strict';

      // ==========================================
      // Constants & Date Helpers (Local Time: 2026-11-25)
      // ==========================================
      const STORAGE_KEY = 'ticktick_safari_replica_v1';
      const TODAY_STR = '2026-11-25';

      function parseDateStr(str) {
        if (!str) return null;
        const [y, m, d] = str.split('-').map(Number);
        return new Date(y, m - 1, d);
      }

      function formatDateStr(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function addDays(dateStr, days) {
        const d = parseDateStr(dateStr);
        d.setDate(d.getDate() + days);
        return formatDateStr(d);
      }

      function getFriendlyDateLabel(dateStr) {
        if (!dateStr) return '';
        if (dateStr === TODAY_STR) return 'Today';
        if (dateStr === addDays(TODAY_STR, 1)) return 'Tomorrow';
        if (dateStr === addDays(TODAY_STR, -1)) return 'Yesterday';
        const d = parseDateStr(dateStr);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function isOverdue(dateStr) {
        return Boolean(dateStr && dateStr < TODAY_STR);
      }

      function isWithinNext7Days(dateStr) {
        if (!dateStr) return false;
        const maxStr = addDays(TODAY_STR, 6);
        return dateStr >= TODAY_STR && dateStr <= maxStr;
      }

      // ==========================================
      // Subtle Web Audio API Sound Effects
      // ==========================================
      let audioCtx = null;
      function playTone(type) {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            audioCtx = new Ctx();
          }
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          const now = audioCtx.currentTime;
          if (type === 'check') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
          } else if (type === 'pomo') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.setValueAtTime(880, now + 0.15);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
          }
        } catch (_) {}
      }

      // ==========================================
      // Initial Seed Data
      // ==========================================
      function createDefaultState() {
        return {
          theme: 'light',
          activeModule: 'tasks', // 'tasks' | 'calendar' | 'matrix' | 'pomodoro' | 'habits'
          activeListId: 'today', // 'today' | 'next7' | 'inbox' | 'all' | 'completed' | 'trash' | 'tag:...' | custom list id
          viewMode: 'list', // 'list' | 'kanban'
          sortBy: 'priority', // 'priority' | 'dueDate' | 'title'
          showCompleted: true,
          sidebarOpen: window.innerWidth >= 768,

          calendarMonth: '2026-11',
          selectedCalendarDay: TODAY_STR,
          lists: [

            },
            {

              days: [addDays(TODAY_STR, -2), addDays(TODAY_STR, -1)]
            },
            {

            }
          ],
          pomodoro: {
            mode: 'focus', // 'focus' (25m) | 'short' (5m) | 'long' (15m)
            secondsLeft: 25 * 60,
            running: false,

            sessionsToday: 2,
            minutesToday: 50
